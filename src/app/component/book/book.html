<h1>Books</h1>

<app-navbar></app-navbar>

<table border="1" cellpadding="6">
    
    <tr>
        <th>id</th><th>Title</th><th>Author</th><th>Category</th><th>Quantity</th><th>Publisher</th><th>Publication year</th><th>Available</th><th>Action</th>
    </tr>
    @for(book of books(); track book.id; let i= $index){
    <tr>
        <td>{{ i+1 }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.category }}</td>
        <td>{{ book.quantity }}</td>
        <td>{{ book.publisher }}</td>
        <td>{{ book.publicationYear }}</td>
        <td>{{ book.available ? "Yes":"No" }}</td>
        <td> 
            <button (click)="edit(book)" >Edit</button> 
            <button (click)="remove(book.id!)" >Delete</button>
        </td>
    </tr>
   }  

</table>
